<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">

      <!-- ── Sidebar ── -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div class="logo-icon">✓</div>
          <span>TaskFlow</span>
        </div>

        <div class="stats">
          <div class="stat-card">
            <span class="stat-num" id="statTotal">0</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat-card">
            <span class="stat-num" id="statDone">0</span>
            <span class="stat-label">Done</span>
          </div>
          <div class="stat-card">
            <span class="stat-num" id="statPending">0</span>
            <span class="stat-label">Pending</span>
          </div>
        </div>

        <div class="sidebar-footer">
          <span>24AIML073 · Dharm Vaghasiya</span>
        </div>
      </aside>

      <!-- ── Main Panel ── -->
      <main class="main">

        <!-- Top bar -->
        <div class="topbar">
          <div>
            <h1 class="page-title">My Tasks</h1>
            <p class="page-sub">Stay organised, stay productive.</p>
          </div>
          <button class="btn-icon" onclick="loadTasks()" title="Refresh">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582M20 20v-5h-.581M5.635 19A9 9 0 104.083 9.17"/>
            </svg>
            Refresh
          </button>
        </div>

        <!-- Add task form -->
        <div class="add-card">
          <input
            type="text"
            id="taskTitle"
            class="task-input"
            placeholder="What needs to be done?"
            onkeydown="if(event.key==='Enter') addTask()"
            autocomplete="off"
          />
          <label class="toggle-wrap">
            <input type="checkbox" id="taskCompleted" />
            <span class="toggle"></span>
            <span class="toggle-label">Mark as done</span>
          </label>
          <button class="btn-primary" onclick="addTask()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            Add Task
          </button>
        </div>

        <!-- Task list -->
        <div id="taskList" class="task-list">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">📋</div>
            <p>No tasks yet. Add one above!</p>
          </div>
        </div>

      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
